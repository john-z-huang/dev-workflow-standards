[project]
name = "dev-workflow-standards-tools"
version = "0.2.0"
description = "Dedicated MCP tools for deterministic dev-workflow-standards operations"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3", "pydantic>=2,<3", "openai>=3.37,<4"]

[dependency-groups]
codex-test = [
    "openai-codex>=0.163.0",
]
dev = ["hatchling>=1.27,<2", "pyyaml>=6,<7"]

[project.scripts]
dev-workflow-standards-tools = "dev_workflow_standards_tools.server:main"
dev-workflow-standards = "dev_workflow_standards_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dev_workflow_standards_tools"]

[tool.hatch.build.targets.sdist]
include = ["dev_workflow_standards_tools", "hatch_build.py", "pyproject.toml"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
